/* ==============================================================
   実験パラメータ設定
   ============================================================== */
const PARAMS = {
  HUE_DEG: 28.0,
  // 実験①：36から72まで完全に6.0刻みの等間隔
  L_LEVELS: [36, 42, 48, 54, 60, 66, 72],

  FIXATION_MS: 1500,
  POST_TRIAL_BLANK_MS: 800,
};

/* ==============================================================
   CIELCh(ab) -> sRGB 変換
   ============================================================== */
const XN = 95.047, YN = 100.0, ZN = 108.883;
function finv(t) { return (t ** 3 > 0.008856) ? t ** 3 : (t - 16 / 116) / 7.787; }
function labToXyz(L, a, b) {
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  return [XN * finv(fx), YN * finv(fy), ZN * finv(fz)];
}
function gammaCompand(c) {
  return (c <= 0.0031308) ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
}
function xyzToSrgbLinear(X, Y, Z) {
  X /= 100; Y /= 100; Z /= 100;
  const r = 3.2406 * X - 1.5372 * Y - 0.4986 * Z;
  const g = -0.9689 * X + 1.8758 * Y + 0.0415 * Z;
  const b = 0.0557 * X - 0.2040 * Y + 1.0570 * Z;
  return [r, g, b];
}
function lchToSrgb(L, C, hDeg, tol = 1e-4) {
  const hRad = hDeg * Math.PI / 180;
  const a = C * Math.cos(hRad), b = C * Math.sin(hRad);
  const [X, Y, Z] = labToXyz(L, a, b);
  const lin = xyzToSrgbLinear(X, Y, Z);
  if (lin.some(v => v < -tol || v > 1 + tol)) return null;
  return lin.map(v => gammaCompand(Math.max(0, Math.min(1, v))));
}
function rgbToHex(rgb) {
  return "#" + rgb.map(v => {
    const n = Math.max(0, Math.min(255, Math.round(v * 255)));
    return n.toString(16).padStart(2, "0").toUpperCase();
  }).join("");
}
function findMaxChroma(L, hDeg) {
  let lo = 0, hi = 150;
  while (hi - lo > 0.1) {
    const mid = (lo + hi) / 2;
    if (lchToSrgb(L, mid, hDeg) !== null) lo = mid; else hi = mid;
  }
  return lo;
}
function lchToLab(L, C, hDeg) {
  const hRad = hDeg * Math.PI / 180;
  return { L, a: C * Math.cos(hRad), b: C * Math.sin(hRad) };
}

/* ==============================================================
   CIEDE2000（知覚的な色差ΔE00の計算。参加者には見せず、
   パレット設計の検証用にコンソールへ出力する）
   ============================================================== */
function deltaE2000(lab1, lab2) {
  const { L: L1, a: a1, b: b1 } = lab1;
  const { L: L2, a: a2, b: b2 } = lab2;
  const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2);
  const avgC = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(avgC, 7) / (Math.pow(avgC, 7) + Math.pow(25, 7))));
  const a1p = a1 * (1 + G), a2p = a2 * (1 + G);
  const C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
  const avgCp = (C1p + C2p) / 2;
  const norm = d => (d + 360) % 360;
  const h1p = norm(Math.atan2(b1, a1p) * 180 / Math.PI);
  const h2p = norm(Math.atan2(b2, a2p) * 180 / Math.PI);
  let dhp = 0;
  if (C1p * C2p !== 0) {
    dhp = h2p - h1p;
    if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360;
  }
  const dLp = L2 - L1, dCp = C2p - C1p;
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin((dhp * Math.PI / 180) / 2);
  const avgLp = (L1 + L2) / 2;
  let avghp = h1p + h2p;
  if (C1p * C2p !== 0) {
    avghp = (h1p + h2p) / 2;
    if (Math.abs(h1p - h2p) > 180) avghp += (h1p + h2p < 360) ? 180 : -180;
  }
  const d2r = Math.PI / 180;
  const T = 1 - 0.17 * Math.cos((avghp - 30) * d2r) + 0.24 * Math.cos((2 * avghp) * d2r)
            + 0.32 * Math.cos((3 * avghp + 6) * d2r) - 0.2 * Math.cos((4 * avghp - 63) * d2r);
  const dTheta = 30 * Math.exp(-Math.pow((avghp - 275) / 25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(avgCp, 7) / (Math.pow(avgCp, 7) + Math.pow(25, 7)));
  const Sl = 1 + (0.015 * Math.pow(avgLp - 50, 2)) / Math.sqrt(20 + Math.pow(avgLp - 50, 2));
  const Sc = 1 + 0.045 * avgCp;
  const Sh = 1 + 0.015 * avgCp * T;
  const Rt = -Math.sin(2 * dTheta * d2r) * Rc;
  return Math.sqrt(
    Math.pow(dLp / Sl, 2) + Math.pow(dCp / Sc, 2) + Math.pow(dHp / Sh, 2)
    + Rt * (dCp / Sc) * (dHp / Sh)
  );
}

// 1. 実験①：明度変化パレット（H固定、Lが6刻みで変化）
function buildExp1Palette() {
  const maxChromas = PARAMS.L_LEVELS.map(L => findMaxChroma(L, PARAMS.HUE_DEG));
  const fixedC = Math.min(...maxChromas);
  return PARAMS.L_LEVELS.map((L, level) => {
    let rgb = lchToSrgb(L, fixedC, PARAMS.HUE_DEG);
    if (!rgb) rgb = lchToSrgb(L, Math.max(0, fixedC - 0.5), PARAMS.HUE_DEG);
    return { level, L, C: fixedC, h: PARAMS.HUE_DEG, hex: rgbToHex(rgb) };
  });
}

// 2. 実験②：色相変化パレット（L・C固定、hDegのみ等間隔変化）
function buildExp2Palette(hAngles) {
  const fixedL = 58.0;
  const maxChromas = hAngles.map(h => findMaxChroma(fixedL, h));
  const fixedC = Math.min(...maxChromas);
  return hAngles.map((h, level) => {
    let rgb = lchToSrgb(fixedL, fixedC, h);
    if (!rgb) rgb = lchToSrgb(fixedL, Math.max(0, fixedC - 0.5), h);
    return { level, L: fixedL, C: fixedC, h, hex: rgbToHex(rgb) };
  });
}

const EXP1_PALETTE = buildExp1Palette();
// ΔE00で隣接ステップを均等化した色相角（narrow: 隣接ΔE00≈7.0固定 / wide: 隣接ΔE00≈11.5固定）
// 彩度Cは各セットごとに自動計算されるが、narrow≈62.8・wide≈62.6とほぼ一致するため実質共通
const EXP2_NARROW_PALETTE = buildExp2Palette([28.0, 38.9, 49.3, 59.4, 69.4, 79.3, 89.2]);
const EXP2_WIDE_PALETTE = buildExp2Palette([28.0, 45.9, 62.8, 79.3, 96.0, 114.4, 136.2]);

// ★パレット設計の検証：隣接するレベル間のΔE2000をコンソールに出力
// （参加者には見せない。ブラウザの開発者ツール(F12)のConsoleで確認できる）
function reportPaletteDeltaE(name, palette) {
  const des = [];
  for (let i = 0; i < palette.length - 1; i++) {
    const lab1 = lchToLab(palette[i].L, palette[i].C, palette[i].h);
    const lab2 = lchToLab(palette[i + 1].L, palette[i + 1].C, palette[i + 1].h);
    des.push(Math.round(deltaE2000(lab1, lab2) * 10) / 10);
  }
  console.log(`[パレット検証] ${name}: 隣接ΔE00 = [${des.join(", ")}]`);
}
reportPaletteDeltaE("実験①(明度)", EXP1_PALETTE);
reportPaletteDeltaE("実験②narrow(色相12°刻み)", EXP2_NARROW_PALETTE);
reportPaletteDeltaE("実験②wide(色相24°刻み)", EXP2_WIDE_PALETTE);

function backgroundHex(L) { return rgbToHex(lchToSrgb(L, 0, 0)); }
function distractorHex(bgL) {
  const shifted = bgL <= 50 ? bgL + 22 : bgL - 22;
  return rgbToHex(lchToSrgb(Math.max(2, Math.min(98, shifted)), 0, 0));
}

/* ==============================================================
   実験ステート管理 & 計画生成
   ============================================================== */
const results = [];

let currentTrialIndex = 0;

function getNextParticipantId() {
  const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
  return "P" + Date.now().toString(36).toUpperCase() + rand;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildFullPlan() {
  const plan = [];
  plan.push({ isPractice: true, colorCondition: "exp1_lightness", timeLimitOn: true });
  plan.push({ isPractice: true, colorCondition: "exp1_lightness", timeLimitOn: false });

  let block1 = [];
  for (let i = 0; i < PARAMS.REPS_PER_COLOR_SET; i++) {
    block1.push({ isPractice: false, colorCondition: "exp1_lightness", timeLimitOn: true });
    block1.push({ isPractice: false, colorCondition: "exp2_narrow", timeLimitOn: true });
    block1.push({ isPractice: false, colorCondition: "exp2_wide", timeLimitOn: true });
  }
  plan.push(...shuffle(block1));

  let block2 = [];
  for (let i = 0; i < PARAMS.REPS_PER_COLOR_SET; i++) {
    block2.push({ isPractice: false, colorCondition: "exp1_lightness", timeLimitOn: false });
    block2.push({ isPractice: false, colorCondition: "exp2_narrow", timeLimitOn: false });
    block2.push({ isPractice: false, colorCondition: "exp2_wide", timeLimitOn: false });
  }
  plan.push(...shuffle(block2));

  return plan;
}

function runNextTrial() {
  timerBar.style.width = "0%";
  if (currentTrialIndex >= trialPlan.length) { return showEnd(); }

  const cond = trialPlan[currentTrialIndex];
  const isPractice = cond.isPractice;
  const label = isPractice ? `【練習】` : `【本番】`;

  progressEl.textContent = `${label} 試行 ${currentTrialIndex + 1} / ${trialPlan.length}`;

  const bgL = PARAMS.BACKGROUND_L;
  document.body.style.background = backgroundHex(bgL);

  app.innerHTML = `<div id="fixation">+</div>`;
  setTimeout(() => runTrial(cond, bgL), PARAMS.FIXATION_MS);
}

function runTrial(cond, bgL) {
  const n = PARAMS.GRID_SIZE * PARAMS.GRID_SIZE;
  const indices = [...Array(n).keys()];
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  const targetIdx = new Set(indices.slice(0, PARAMS.TARGET_COUNT));

  let palette;
  if (cond.colorCondition === "exp1_lightness") {
    palette = EXP1_PALETTE;
  } else if (cond.colorCondition === "exp2_narrow") {
    palette = EXP2_NARROW_PALETTE;
  } else {
    palette = EXP2_WIDE_PALETTE;
  }

  const targetOrderMap = {};
  [...targetIdx].forEach((idx, i) => { targetOrderMap[idx] = palette[i]; });

  const dGray = distractorHex(bgL);

  const bannerClass = cond.timeLimitOn ? "banner-timelimit" : "banner-notimelimit";
  const bannerText = cond.timeLimitOn ? "制限時間あり" : "制限時間なし";
  const practiceNotice = cond.isPractice ? "<span style='font-size:13px; opacity:0.8; margin-left:8px;'>[練習]</span>" : "";

  app.innerHTML = `
    <div id="taskContainer">
      <div id="conditionBanner" class="${bannerClass}">
        ${bannerText}${practiceNotice}
      </div>
      <div id="gridArea"></div>
    </div>`;

  const gridArea = document.getElementById("gridArea");
  const cellEls = [];

  for (let i = 0; i < n; i++) {
    const div = document.createElement("div");
    div.className = "cell";
    const isTarget = targetIdx.has(i);
    div.style.background = isTarget ? targetOrderMap[i].hex : dGray;
    div.dataset.index = i;
    div.dataset.active = isTarget ? "1" : "0";
    gridArea.appendChild(div);
    cellEls.push(div);
  }

  const gridX = i => i % PARAMS.GRID_SIZE;
  const gridY = i => Math.floor(i / PARAMS.GRID_SIZE);

  let clickOrder = 0;
  let lastTime = performance.now();
  let lastClickPos = null;
  let finished = false;
  const trialStart = performance.now();

  function cellCenter(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function endTrial() {
    if (finished) return;
    finished = true;
    cellEls.forEach(el => el.removeEventListener("click", onClick));

    if (!cond.isPractice) {
      [...targetIdx].forEach(idx => {
        const el = cellEls[idx];
        if (el.dataset.active === "1") {
          results.push({
            participant: participantId, trial_num: currentTrialIndex + 1,
            color_condition: cond.colorCondition,
            time_limit_condition: cond.timeLimitOn,
            click_order: null, grid_x: gridX(idx), grid_y: gridY(idx),
            color_level: targetOrderMap[idx].level, hex_code: targetOrderMap[idx].hex,
            rt_ms: null, distance_px: null, timed_out: true,
          });
        }
      });
    }

    if (currentTrialIndex === PARAMS.PRACTICE_TRIALS - 1) {
      setTimeout(() => {
        document.body.style.background = "#444";
        timerBar.style.width = "0%";
        app.innerHTML = `
          <div class="screen">
            <h1>練習が終了しました</h1>
            <p>ここから本番が始まります。</p>
            <div style="background:rgba(255,85,85,0.15); border-left:4px solid #ff5555; padding:12px 16px; margin:20px 0; border-radius:4px;">
              <h2 style="margin:0 0 6px 0; color:#ff8888; font-size:17px;">【本番1：制限時間あり（15試行）】</h2>
              <p style="margin:0;">画面上部に赤いタイマーバーが表示されます。<br>重要だと感じる順に、<b>時間内に7個すべて</b>選ぶように素早くクリックしてください。</p>
            </div>
            <button id="goBlock1Btn">本番1を開始する</button>
          </div>`;
        document.getElementById("goBlock1Btn").onclick = () => {
          currentTrialIndex++;
          runNextTrial();
        };
      }, 500);
      return;
    }

    const block1EndIndex = PARAMS.PRACTICE_TRIALS + (PARAMS.REPS_PER_COLOR_SET * 3) - 1;
    if (currentTrialIndex === block1EndIndex) {
      setTimeout(() => {
        document.body.style.background = "#444";
        timerBar.style.width = "0%";
        app.innerHTML = `
          <div class="screen">
            <h1>本番ブロック1が終了しました</h1>
            <div style="background:rgba(43,125,233,0.15); border-left:4px solid #2b7de9; padding:12px 16px; margin:20px 0; border-radius:4px;">
              <h2 style="margin:0 0 6px 0; color:#88bbff; font-size:17px;">【本番2：制限時間なし（15試行）】</h2>
              <p style="margin:0;">ここからは時間制限がありません。重要だと感じる順に<b>7個すべて</b>選んでください。</p>
            </div>
            <button id="goBlock2Btn">本番2を開始する</button>
          </div>`;
        document.getElementById("goBlock2Btn").onclick = () => {
          currentTrialIndex++;
          runNextTrial();
        };
      }, 500);
      return;
    }

    setTimeout(() => { currentTrialIndex++; runNextTrial(); }, PARAMS.POST_TRIAL_BLANK_MS);
  }

  function onClick(e) {
    const el = e.currentTarget;
    if (el.dataset.active !== "1") return;
    const idx = Number(el.dataset.index);
    const now = performance.now();
    const rt = Math.round(now - lastTime);
    const pos = cellCenter(el);
    let dist = null;
    if (lastClickPos) {
      dist = Math.round(Math.hypot(pos.x - lastClickPos.x, pos.y - lastClickPos.y) * 100) / 100;
    }
    clickOrder++;

    if (!cond.isPractice) {
      results.push({
        participant: participantId, trial_num: currentTrialIndex + 1,
        color_condition: cond.colorCondition,
        time_limit_condition: cond.timeLimitOn,
        click_order: clickOrder, grid_x: gridX(idx), grid_y: gridY(idx),
        color_level: targetOrderMap[idx].level, hex_code: targetOrderMap[idx].hex,
        rt_ms: rt, distance_px: dist, timed_out: false,
      });
    }

    el.style.background = dGray;
    el.dataset.active = "0";
    lastTime = now;
    lastClickPos = pos;
    if (clickOrder >= PARAMS.TARGET_COUNT) endTrial();
  }

  cellEls.forEach(el => el.addEventListener("click", onClick));

  if (cond.timeLimitOn) {
    const limitMs = PARAMS.TIME_LIMIT_SEC * 1000;
    const tick = () => {
      if (finished) return;
      const elapsed = performance.now() - trialStart;
      timerBar.style.width = Math.max(0, 100 - (elapsed / limitMs) * 100) + "%";
      if (elapsed >= limitMs) { endTrial(); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}

function showEnd() {
  document.body.style.background = "#444";
  timerBar.style.width = "0%";
  progressEl.textContent = "";
  showQuestionnaire();
}

function showQuestionnaire() {
  app.innerHTML = `
    <div class="screen" style="max-height:85vh; overflow-y:auto;">
      <h1>事後アンケート</h1>
      <p>実験のご協力ありがとうございました。設計改善のため率直なご意見をお願いいたします。</p>

      <p style="margin-top:16px;"><b>1. 色の選び方・判断基準</b><br><span style="font-size:13px; color:#ccc;">（例：一番濃い色や特定の色相から選んだ、位置が近いものから選んだ 等）</span></p>
      <textarea id="qStrategy" rows="2"></textarea>

      <p style="margin-top:16px;"><b>2. 実験手順・画面表示で分かりにくかった点や不具合</b><br><span style="font-size:13px; color:#ccc;">（例：説明が分かりづらい、色の識別が難しかった、テンポが速い/遅い 等）</span></p>
      <textarea id="qImprovement" rows="3" placeholder="改善点等があればご自由にご記入ください"></textarea>

      <button id="submitQBtn">回答を送信して完了する</button>
    </div>`;

  document.getElementById("submitQBtn").onclick = function () {
    try {
      var btn = document.getElementById("submitQBtn");
      btn.disabled = true;
      btn.textContent = "データを送信中...";

      var surveyData = {
        participant: participantId || "unknown",
        age: screeningData.age || "",
        gender: screeningData.gender || "",
        device_type: screeningData.device_type || "",
        device_spec: screeningData.device_spec || "",
        vision: screeningData.vision || "",
        color_vision: screeningData.color_vision || "",
        strategy: document.getElementById("qStrategy") ? document.getElementById("qStrategy").value : "",
        improvement_feedback: document.getElementById("qImprovement") ? document.getElementById("qImprovement").value : "",
        screen_width: window.screen.width,
        screen_height: window.screen.height,
        viewport_width: window.innerWidth,
        viewport_height: window.innerHeight,
        user_agent: navigator.userAgent
      };

      var payload = { trials: results, survey: surveyData };

      var form = document.createElement("form");
      form.method = "POST";
      form.action = GOOGLE_SHEET_ENDPOINT;
      form.target = "hidden_iframe";

      var input = document.createElement("input");
      input.type = "hidden";
      input.name = "data";
      input.value = JSON.stringify(payload);
      form.appendChild(input);

      var iframe = document.getElementById("hidden_iframe");
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.id = "hidden_iframe";
        iframe.name = "hidden_iframe";
        iframe.style.display = "none";
        document.body.appendChild(iframe);
      }

      document.body.appendChild(form);
      form.submit();

      setTimeout(function () {
        showThankYouScreen();
      }, 1500);

    } catch (err) {
      alert("送信エラー:\n" + err.name + ": " + err.message);
      showThankYouScreen();
    }
  };
}

// ★送信の成否はhidden iframeでは確認できないため、常にバックアップDLを提示する
function showThankYouScreen() {
  const csvLines = ["participant,trial_num,color_condition,time_limit_condition,click_order,grid_x,grid_y,color_level,hex_code,rt_ms,distance_px,timed_out"];
  results.forEach(r => csvLines.push(Object.values(r).join(",")));
  const csvBlob = new Blob([csvLines.join("\n")], { type: "text/csv" });
  const csvUrl = URL.createObjectURL(csvBlob);

  app.innerHTML = `
    <div class="screen" style="text-align:center;">
      <h1 style="border:none;">実験終了</h1>
      <p style="font-size:16px; margin:24px 0;">ご協力ありがとうございました！</p>
      <p style="color:#aaa; font-size:12px;">
        （送信の確認が取れないため、念のためのバックアップです。<br>
        可能であれば下のボタンからもダウンロードして担当者にお送りください）
      </p>
      <a href="${csvUrl}" download="backup_${participantId}.csv"><button>バックアップをダウンロード</button></a>
    </div>`;
}

showConsentScreen();
</script>
